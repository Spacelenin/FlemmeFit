name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests + APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk FlemmeFit-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FlemmeFit-${{ github.run_number }}
          path: FlemmeFit-${{ github.run_number }}.apk

      # Sur main : une release GitHub par build, l'APK se télécharge directement depuis le téléphone.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlemmeFit build ${{ github.run_number }}
          body: "APK à installer : FlemmeFit-${{ github.run_number }}.apk (commit ${{ github.sha }})"
          files: FlemmeFit-${{ github.run_number }}.apk
          make_latest: true
