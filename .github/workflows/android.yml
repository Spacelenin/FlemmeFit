name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Notes de toutes les versions publiées (et de celle-ci), embarquées dans l'APK : le « Quoi de neuf » et
      # l'historique s'affichent même hors ligne, et survivent au passage du code en privé.
      - name: Notes de version embarquées
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          CURRENT_NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p app/src/main/assets
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | {tag: .tag_name, body: (.body // "")}' > /tmp/releases.jsonl || true
          python3 - <<'PY'
          import json, os, re
          notes = {}
          for line in open('/tmp/releases.jsonl', encoding='utf-8'):
              line = line.strip()
              if not line:
                  continue
              r = json.loads(line)
              m = re.match(r'^build-(\d+)$', r['tag'])
              if m and r['body'].strip():
                  notes[int(m.group(1))] = r['body']
          current = os.environ.get('CURRENT_NOTES', '').strip()
          if os.environ.get('EVENT') == 'push' and current:
              notes[int(os.environ['RUN_NUMBER'])] = current
          data = [{'v': v, 'n': n} for v, n in sorted(notes.items(), reverse=True)]
          with open('app/src/main/assets/release-notes.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)
          print(len(data), 'notes embarquées')
          PY

      - name: Tests + APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
        # Nouvelle clé de signature (rotation, voir app/build.gradle.kts). Sans ces secrets, l'ancienne clé seule.
        env:
          FLEMMEFIT_KEYSTORE_B64: ${{ secrets.FLEMMEFIT_KEYSTORE_B64 }}
          FLEMMEFIT_KEYSTORE_PASSWORD: ${{ secrets.FLEMMEFIT_KEYSTORE_PASSWORD }}
          FLEMMEFIT_KEY_ALIAS: flemmefit

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk FlemmeFit-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FlemmeFit-${{ github.run_number }}
          path: FlemmeFit-${{ github.run_number }}.apk

      # Sur main : une release GitHub par build, l'APK se télécharge directement depuis le téléphone.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FlemmeFit build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: FlemmeFit-${{ github.run_number }}.apk
          make_latest: true

      # Repo public des APK : l'appli y cherche ses mises à jour, le code peut rester privé.
      # Jeton à part (RELEASES_TOKEN, droits limités à ce repo), jamais dans l'appli.
      - name: Release publique
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          repository: Spacelenin/FlemmeFit-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          target_commitish: main
          tag_name: build-${{ github.run_number }}
          name: FlemmeFit build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: FlemmeFit-${{ github.run_number }}.apk
          make_latest: true
