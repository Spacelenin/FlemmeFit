name: Montre

# App montre (Wear OS), construite à part de l'app du téléphone.
on:
  push:
    paths: ["wear/**", ".github/workflows/montre.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK montre
        run: ./gradlew --no-daemon -p wear assembleRelease
        # Même signature que le téléphone (rotation de clé, voir wear/build.gradle.kts).
        env:
          FLEMMEFIT_KEYSTORE_B64: ${{ secrets.FLEMMEFIT_KEYSTORE_B64 }}
          FLEMMEFIT_KEYSTORE_PASSWORD: ${{ secrets.FLEMMEFIT_KEYSTORE_PASSWORD }}
          FLEMMEFIT_KEY_ALIAS: flemmefit

      - name: Renommer l'APK
        run: cp wear/build/outputs/apk/release/wear-release.apk FlemmeFit-montre-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FlemmeFit-montre-${{ github.run_number }}
          path: FlemmeFit-montre-${{ github.run_number }}.apk

      # Publiée en pré-version dans le repo public : la montre la trouve, l'app du téléphone l'ignore.
      - name: Release montre
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          repository: Spacelenin/FlemmeFit-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          target_commitish: main
          tag_name: montre-${{ github.run_number }}
          name: FlemmeFit montre ${{ github.run_number }}
          body: Version de test de l'app montre.
          files: FlemmeFit-montre-${{ github.run_number }}.apk
          prerelease: true
          make_latest: false
